server {
    listen 80 default_server;
    server_name _;

    location = /app-config.json {
        alias __ROOT__/config-server/public/app-config.json;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "max-age=60, must-revalidate";
    }

    location /download/ {
        alias __ROOT__/config-server/public/download/;
        autoindex off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /download/app-release.apk {
        alias __ROOT__/config-server/public/download/app-release.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="模宇宙(糖艺大模王)-v0.0.5.apk"';
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        etag off;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        alias __ROOT__/admin-web/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /mobile/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 200 "模宇宙(糖艺大模王) gateway is running\n/download/ - App APK\n/api/v1/models\n/admin/\n/mobile/\n";
        add_header Content-Type text/plain;
    }
}
