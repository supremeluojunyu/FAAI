# 从 FRP / 上游代理传入的头中解析真实客户端 IP（避免日志里全是 127.0.0.1）
map $http_x_forwarded_for $client_ip_from_xff {
    ""      "";
    default $http_x_forwarded_for;
}

map $http_x_real_ip $client_real_ip {
    ""      $client_ip_from_xff;
    default $http_x_real_ip;
}

# FRP 开启 Proxy Protocol 后，真实 IP 在 $proxy_protocol_addr
map $proxy_protocol_addr $client_ip_from_pp {
    ""      "";
    default $proxy_protocol_addr;
}

map $client_real_ip $client_ip_merged {
    ""      $client_ip_from_pp;
    default $client_real_ip;
}

# 若仍无公网 IP，回退直连地址（局域网直连 80 口会得到真实内网 IP）
map $client_ip_merged $client_ip_final {
    ""      $remote_addr;
    default $client_ip_merged;
}

server {
    listen 80 default_server;
    # FRP 专用：仅本机 frpc 连此口，携带 Proxy Protocol v2 真实访客 IP
    listen 127.0.0.1:9080 default_server proxy_protocol;
    server_name _;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;
    real_ip_recursive on;

    location = /app-config.json {
        alias __ROOT__/config-server/public/app-config.json;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "max-age=60, must-revalidate";
    }

    location /download/ {
        alias __ROOT__/config-server/public/download/;
        autoindex off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /download/app-release.apk {
        alias __ROOT__/config-server/public/download/app-release.apk;
        default_type application/vnd.android.package-archive;
        include __ROOT__/config-server/public/download/apk-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        etag off;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_final;
        proxy_set_header X-Forwarded-For $client_ip_final;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_final;
        proxy_set_header X-Forwarded-For $client_ip_final;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        alias __ROOT__/admin-web/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /mobile/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 200 "模宇宙(糖艺大模王) gateway is running\n/download/ - App APK\n/api/v1/models\n/admin/\n/mobile/\n";
        add_header Content-Type text/plain;
    }
}
